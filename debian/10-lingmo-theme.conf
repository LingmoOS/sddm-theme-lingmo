# Lingmo OS: enable the sddm-theme-lingmo theme.
#
# Shipped by the sddm-theme-lingmo package into /etc/sddm.conf.d/ so that it does
# not clash with /etc/sddm.conf, which other SDDM themes write to as well.
# Edit or remove this file (then restart sddm) to use a different theme.
[General]
InputMethod=qtvirtualkeyboard
GreeterEnvironment=QML2_IMPORT_PATH=/usr/share/sddm/themes/lingmo/components/,QT_IM_MODULE=qtvirtualkeyboard

[Theme]
Current=lingmo
